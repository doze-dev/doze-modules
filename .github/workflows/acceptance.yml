# Acceptance suite: each module's `-tags acceptance` matrix (via the SDK
# enginetest harness) against its REAL backend. This proves every config option
# converges into the running backend, not just that the HCL decodes.
#
# The backends are the prebuilt ones users download from doze-binaries
# (scripts/backend-env.sh), the same ones release.yml gates on. Building them
# from source is doze-binaries' own CI; doing it here made this suite slow and
# flaky (a source clone that dropped mid-transfer failed it for weeks).
name: acceptance

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'Single engine to run ("all" for every engine)'
        required: false
        default: all
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        module: [postgres, mariadb, valkey, kvrocks, temporal, ferret]
    runs-on: ubuntu-latest
    env:
      WANTED: ${{ github.event.inputs.engine || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Fetch prebuilt ${{ matrix.module }} backend
        if: ${{ env.WANTED == 'all' || env.WANTED == matrix.module }}
        run: scripts/backend-env.sh ${{ matrix.module }} >> "$GITHUB_ENV"
      - name: Run ${{ matrix.module }} acceptance
        if: ${{ env.WANTED == 'all' || env.WANTED == matrix.module }}
        run: go test -tags acceptance -v -timeout 20m ./modules/${{ matrix.module }}/...
